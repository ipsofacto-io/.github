name: security-txt

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "40 6 * * 1" # 06:40 UTC Monday: fails 30 days before Expires

permissions:
  contents: read

concurrency:
  group: security-txt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-txt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s scripts -v
      - name: Check security.txt
        run: python3 scripts/check_security_txt.py
